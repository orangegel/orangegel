name: OrangeGel Release Build (Blacksmith)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS .app & .dmg (Blacksmith macOS)
    runs-on: blacksmith-8vcpu-macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Blacksmith)
        uses: useblacksmith/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Blacksmith Rust Cache
        uses: useblacksmith/rust-cache@v1
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri macOS Application & DMG
        run: npx tauri build

  release-linux:
    name: Build Linux AppImage & Deb (Blacksmith Linux)
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js 22 (Blacksmith)
        uses: useblacksmith/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Blacksmith Rust Cache
        uses: useblacksmith/rust-cache@v1
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Linux Bundles
        run: npx tauri build
