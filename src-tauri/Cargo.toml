[package]
name = "orangegel"
version = "0.1.0"
description = "OrangeGel — Desktop Static Site Generator IDE & Multi-Device Studio (Hugo Preferred + Top 20 SSGs)"
authors = ["Jason Smith <jason@jasonsmith.io>"]
homepage = "https://github.com/orangegel"
repository = "https://github.com/orangegel/orangegel"
edition = "2021"

[lib]
name = "orangegel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
libc = "0.2"
